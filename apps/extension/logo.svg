<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan gradient for the V -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="35%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Cyan highlight / edge gradient -->
    <linearGradient id="cyanHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Royal/Electric Blue gradient for the 3 standing dashes -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Center Dash Blue Gradient (slightly brighter accent) -->
    <linearGradient id="blueCenterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Subtle drop shadows for depth while maintaining clean vector transparent look -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#06B6D4" flood-opacity="0.35"/>
    </filter>
    <filter id="dashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 3 Upright / Standing Dashes (Vertical Bars) in Blue -->
  <g id="standing-dashes" filter="url(#dashGlow)">
    <!-- Left Vertical Dash -->
    <rect x="176" y="68" width="32" height="108" rx="16" fill="url(#blueGradient)"/>

    <!-- Center Vertical Dash (Taller / Apex) -->
    <rect x="240" y="36" width="32" height="140" rx="16" fill="url(#blueCenterGradient)"/>

    <!-- Right Vertical Dash -->
    <rect x="304" y="68" width="32" height="108" rx="16" fill="url(#blueGradient)"/>
  </g>

  <!-- Main V Shape in Cyan (Sian) -->
  <g id="v-symbol" filter="url(#subtleGlow)">
    <!-- Main Outer V Body -->
    <path d="M 88 206
             C 88 198 94.5 192 103 192
             L 175 192
             C 183 192 190 197 194 205
             L 256 348
             L 318 205
             C 322 197 329 192 337 192
             L 409 192
             C 417.5 192 424 198 424 206
             C 424 210 422 215 419 219
             L 282 462
             C 272 478 240 478 230 462
             L 93 219
             C 90 215 88 210 88 206 Z"
          fill="url(#cyanGradient)"/>

    <!-- Left Wing Facet / Inner Sheen for 3D Modern Feel -->
    <path d="M 103 192
             L 175 192
             C 183 192 190 197 194 205
             L 256 348
             L 230 462
             L 93 219
             C 90 215 88 210 88 206
             C 88 198 94.5 192 103 192 Z"
          fill="url(#cyanHighlight)"
          opacity="0.25"/>
  </g>
</svg>
